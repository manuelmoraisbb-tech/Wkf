name: Compactar arquivos da pasta main

on:
  workflow_dispatch: # corre quando clicares em "Run workflow"
  push:
    paths:
      - 'main/sem_imagem.txt'
      - 'main/com_imagem.json'
      - 'main/ainda_sem_imagem.txt'
      - 'main/nomes.json'
      

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Procurar e compactar arquivos
        run: |
          echo "A procurar arquivos em main/..."
          ls -lh main/ || echo "Pasta main não encontrada"

          # Cria pasta temporária
          mkdir -p arquivos_encontrados

          # Copia só se existir
          for arquivo in sem_imagem.txt nomes_revisar.txt nomes_manuais.json; do
            if [ -f "main/$arquivo" ]; then
              echo "✅ Encontrado: main/$arquivo"
              cp "main/$arquivo" "arquivos_encontrados/"
            else
              echo "⚠️ Não encontrado: main/$arquivo"
            fi
          done

          # Verifica se achou algum
          if [ -z "$(ls -A arquivos_encontrados)" ]; then
            echo "❌ Nenhum arquivo encontrado, a cancelar..."
            exit 1
          fi

          # Compacta num zip
          cd arquivos_encontrados
          zip -r ../arquivos_main.zip .
          cd ..
          ls -lh arquivos_main.zip

      - name: Enviar zip como artefato
        uses: actions/upload-artifact@v4
        with:
          name: arquivos_main
          path: arquivos_main.zip
          retention-days: 30
