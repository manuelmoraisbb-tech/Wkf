name: Posters (TMDb)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # nunca corre duas vezes ao mesmo tempo
  group: posters-tmdb
  cancel-in-progress: false

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"          # o log aparece em tempo real
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Verificar ficheiros
        run: |
          test -f buscar_posters.py || (echo "Falta o buscar_posters.py no repositório" && exit 1)
          test -f sem_imagem.txt || (echo "Falta o sem_imagem.txt no repositório" && exit 1)
          echo "$(grep -c . sem_imagem.txt) nomes para procurar"

      # O token já está dentro do script, não precisa de secrets nem de definições
      - name: Buscar posters
        run: python buscar_posters.py

      # O script termina "sem erro" mesmo quando a chave falha no teste; aqui detetamos isso
      - name: Confirmar que funcionou
        run: |
          if [ ! -f com_imagem.json ]; then
            echo "A chave do TMDb falhou no teste inicial. Ver o log do passo anterior."
            exit 1
          fi

      # always(): guarda o que já foi feito mesmo que o job falhe ou seja cancelado
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in posters com_imagem.json ainda_sem_imagem.txt; do [ -e "$f" ] && git add "$f"; done
          git diff --staged --quiet || git commit -m "Posters do TMDb"
          git pull --rebase
          git push
