name: Compactar arquivos da pasta main

on:
  workflow_dispatch:
  push:
    paths:
      - 'sem_imagem.txt'
      - 'nomes_revisar.txt'
      - 'nomes_manuais.json'
      - 'nomes.json'
      - 'com_imagem.json'
      - 'ainda_sem_imagem.txt'

permissions:
  contents: read

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar arquivo ZIP
        run: python3 compactar_arquivos.py

      - name: Enviar ZIP como artefato
        uses: actions/upload-artifact@v4
        with:
          name: arquivos_main
          path: arquivos_main.zip
          if-no-files-found: error
          retention-days: 30
