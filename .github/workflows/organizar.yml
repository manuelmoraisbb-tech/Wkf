name: Nomes e imagens dos animes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # nunca corre duas vezes ao mesmo tempo
  group: nomes-e-imagens
  cancel-in-progress: false

jobs:
  nomes:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Verificar o nomes.json (criado no telemóvel com extrair_nomes.py)
        run: test -f nomes.json || (echo "Falta o nomes.json no repositório" && exit 1)

      # Retoma sozinho: só pesquisa os animes que ainda não estão "feito" no nomes.json
      - name: Nomes e imagens (AniList)
        run: python nomes_e_imagens.py nomes.json
        env:
          ORCAMENTO_MIN: "300"

      # always(): guarda o progresso mesmo que o passo acima falhe, seja cancelado ou estoure o tempo
      - name: Guardar progresso
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nomes.json nomes_revisar.txt sem_imagem.txt
          git diff --staged --quiet || git commit -m "Nomes e imagens (progresso)"
          git pull --rebase
          git push
